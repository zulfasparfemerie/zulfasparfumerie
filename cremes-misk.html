<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zulfa’ Parfumerie | Crèmes et Misk</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .selection-container { padding: 40px 0; }
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            margin-top: 30px;
        }
        .product-item {
            background: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .product-item.selected {
            border-color: #FF69B4;
            background: #FFF0F5;
        }
        .product-item img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .product-item h3 { font-size: 1.1rem; margin-bottom: 5px; text-transform: capitalize; }
        .product-item p { color: #FF69B4; font-weight: 600; margin-bottom: 10px; }
        
        .order-summary {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            display: none;
            z-index: 1001;
            text-align: center;
        }
        .order-summary.active { display: block; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            .product-grid { gap: 10px; padding: 10px; }
            .product-item img { height: 180px; }
        }
    </style>
</head>
<body>
    <header class="navbar scrolled">
        <div class="container">
            <div class="logo">
                <a href="index.html" class="logo-text">Zulfa’ Parfumerie</a>
            </div>
            <a href="index.html" style="font-size: 0.9rem; color: #FF69B4;"><i class="fas fa-arrow-left"></i> Retour</a>
        </div>
    </header>

    <main class="selection-container">
        <div class="container">
            <h2 style="text-align: center;">Choisissez Vos Produits</h2>
            <p style="text-align: center; color: #666; margin-top: 10px;">Misk: 79 DH | Crème: 89 DH</p>
            <p style="text-align: center; color: #FF69B4; font-weight: 700;">Pack (Misk + Crème): 159 DH</p>
            
            <div class="product-grid">
                <div class="product-item" id="item-misk" onclick="toggleProduct('Misk', 79)">
                    <img src="image/misk.png" alt="Misk Attraction">
                    <h3>Misk Attraction</h3>
                    <p>79 DH</p>
                    <button class="btn btn-outline" style="width: 100%; font-size: 0.8rem; padding: 8px;">Sélectionner</button>
                </div>
                <div class="product-item" id="item-creme" onclick="toggleProduct('Crème', 89)">
                    <img src="image/crème.png" alt="Crème Hydratante">
                    <h3>Crème Hydratante</h3>
                    <p>89 DH</p>
                    <button class="btn btn-outline" style="width: 100%; font-size: 0.8rem; padding: 8px;">Sélectionner</button>
                </div>
            </div>
        </div>
    </main>

    <div id="orderSummary" class="order-summary">
        <p id="summaryText">Total: 0 DH</p>
        <button id="checkoutBtn" class="btn btn-primary" disabled>Commander Maintenant</button>
    </div>

    <!-- Order Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3>Informations de Livraison</h3>
            <div class="form-group">
                <label>Nom et Prénom</label>
                <input type="text" id="orderName" required>
            </div>
            <div class="form-group">
                <label>Adresse Complète</label>
                <textarea id="orderAddress" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Numéro de Téléphone</label>
                <input type="tel" id="orderPhone" required>
            </div>
            <button id="confirmBtn" class="btn btn-primary" style="width: 100%; margin-bottom: 10px;">Confirmer la Commande</button>
            <button onclick="document.getElementById('orderModal').classList.remove('active')" class="btn btn-primary" style="width: 100%; background: #FF69B4; border-color: #FF69B4;">Annuler</button>
        </div>
    </div>

    <script>
        let selectedProducts = [];
        let totalPrice = 0;

        function toggleProduct(name, price) {
            const index = selectedProducts.indexOf(name);
            const element = document.getElementById(`item-${name === 'Misk' ? 'misk' : 'creme'}`);
            
            if (index > -1) {
                selectedProducts.splice(index, 1);
                element.classList.remove('selected');
                element.querySelector('button').innerText = 'Sélectionner';
            } else {
                selectedProducts.push(name);
                element.classList.add('selected');
                element.querySelector('button').innerText = 'Sélectionné';
            }

            updateSummary();
        }

        function updateSummary() {
            const summary = document.getElementById('orderSummary');
            const summaryText = document.getElementById('summaryText');
            const checkoutBtn = document.getElementById('checkoutBtn');

            if (selectedProducts.length === 0) {
                summary.classList.remove('active');
                totalPrice = 0;
            } else {
                summary.classList.add('active');
                if (selectedProducts.length === 2) {
                    totalPrice = 159;
                } else {
                    totalPrice = selectedProducts[0] === 'Misk' ? 79 : 89;
                }
                summaryText.innerText = `Total: ${totalPrice} DH (${selectedProducts.join(' + ')})`;
                checkoutBtn.disabled = false;
            }
        }

        document.getElementById('checkoutBtn').onclick = () => {
            document.getElementById('orderModal').classList.add('active');
        };

        document.getElementById('confirmBtn').onclick = () => {
            const name = document.getElementById('orderName').value;
            const address = document.getElementById('orderAddress').value;
            const phone = document.getElementById('orderPhone').value;

            if(!name || !address || !phone) {
                alert("Veuillez remplir toutes les informations.");
                return;
            }

            const message = `Nouvelle Commande (Crèmes et Misk)\n\n` +
                          `Produits: ${selectedProducts.join(' + ')}\n` +
                          `Prix Total: ${totalPrice} DH\n\n` +
                          `Client:\nNom: ${name}\nAdresse: ${address}\nTéléphone: ${phone}`;
            
            const whatsappUrl = `https://wa.me/212651725437?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        };
    </script>
</body>
</html>
