<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zulfa’ Parfumerie | Choisir Votre Pack</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .selection-container { padding: 40px 0; }
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; 
            margin-top: 30px;
        }
        .product-item {
            background: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .product-item.selected {
            border-color: #FF69B4;
            background: #FFF0F5;
        }
        .product-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .product-item h3 { font-size: 0.9rem; margin-bottom: 10px; text-transform: capitalize; }
        .select-btn {
            background: #eee;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            width: 100%;
        }
        .selected .select-btn {
            background: #FF69B4;
            color: white;
        }
        .order-summary {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            display: none;
            z-index: 1001;
            text-align: center;
        }
        .order-summary.active { display: block; }
        
        /* Modal Style */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 10px;
            }
            .product-item { padding: 10px; }
            .product-item img { height: 140px; }
        }
    </style>
</head>
<body>
    <header class="navbar scrolled">
        <div class="container">
            <div class="logo">
                <a href="index.html" class="logo-text">Zulfa’s Parfumerie</a>
            </div>
            <a href="index.html" style="font-size: 0.9rem; color: #FF69B4;"><i class="fas fa-arrow-left"></i> Retour</a>
        </div>
    </header>

    <main class="selection-container">
        <div class="container">
            <h2 style="text-align: center;">Choisissez 3 Parfums</h2>
            <p style="text-align: center; color: #FF69B4; font-weight: 600;">Prix Pack: 199 DH et livraison gratuit</p>
            
            <div id="productGrid" class="product-grid">
                <!-- Products will be injected by JS -->
            </div>
        </div>
    </main>

    <div id="orderSummary" class="order-summary">
        <p><span id="selectedCount">0</span>/3 Parfums sélectionnés</p>
        <button id="checkoutBtn" class="btn btn-primary" disabled>Commander Maintenant</button>
    </div>

    <!-- Order Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3>Informations de Livraison</h3>
            <div class="form-group">
                <label>Nom et Prénom</label>
                <input type="text" id="orderName" required>
            </div>
            <div class="form-group">
                <label>Adresse Complète</label>
                <textarea id="orderAddress" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Numéro de Téléphone</label>
                <input type="tel" id="orderPhone" required>
            </div>
            <button id="confirmBtn" class="btn btn-primary" style="width: 100%; margin-bottom: 10px;">Confirmer la Commande</button>
            <button onclick="document.getElementById('orderModal').classList.remove('active')" class="btn btn-primary" style="width: 100%; background: #FF69B4; border-color: #FF69B4;">Annuler</button>
        </div>
    </div>

    <script>
        const perfumes = [
            "bianco lette", "burberry her", "crystal noir", "delina", 
            "divine jean paul", "idole", "interdit rouge", "jadore", 
            "kayali vanille", "l impératrice", "libre yves", "light bleu", 
            "my way", "narciso", "prada paradox", "valentino", "victoria secret"
        ];

        const grid = document.getElementById('productGrid');
        const selectedCountSpan = document.getElementById('selectedCount');
        const orderSummary = document.getElementById('orderSummary');
        const checkoutBtn = document.getElementById('checkoutBtn');
        let selectedPerfumes = [];

        perfumes.forEach(p => {
            const div = document.createElement('div');
            div.className = 'product-item';
            div.innerHTML = `
                <img src="image/${p}.jpeg" alt="${p}">
                <h3>${p}</h3>
                <button class="select-btn">Sélectionner</button>
            `;
            div.onclick = () => toggleSelect(p, div);
            grid.appendChild(div);
        });

        function toggleSelect(name, element) {
            const index = selectedPerfumes.indexOf(name);
            if (index > -1) {
                selectedPerfumes.splice(index, 1);
                element.classList.remove('selected');
            } else {
                if (selectedPerfumes.length < 3) {
                    selectedPerfumes.push(name);
                    element.classList.add('selected');
                } else {
                    alert("Vous pouvez choisir seulement 3 parfums pour ce pack.");
                }
            }
            
            selectedCountSpan.innerText = selectedPerfumes.length;
            orderSummary.classList.add('active');
            checkoutBtn.disabled = selectedPerfumes.length !== 3;
        }

        checkoutBtn.onclick = () => {
            document.getElementById('orderModal').classList.add('active');
        };

        document.getElementById('confirmBtn').onclick = () => {
            const name = document.getElementById('orderName').value;
            const address = document.getElementById('orderAddress').value;
            const phone = document.getElementById('orderPhone').value;

            if(!name || !address || !phone) {
                alert("Veuillez remplir toutes les informations.");
                return;
            }

            const message = `Nouvelle Commande (Pack 3 Parfums - 199 DH)\n\n` +
                          `Produits:\n- ${selectedPerfumes.join('\n- ')}\n\n` +
                          `Client:\nNom: ${name}\nAdresse: ${address}\nTéléphone: ${phone}`;
            
            const whatsappUrl = `https://wa.me/212651725437?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        };
    </script>
</body>
</html>
